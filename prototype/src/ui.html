<title>Zemya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ============================================================
   ZEMYA — a chart-room dark interface.
   Single committed theme: deep sea ink, brass instruments.
   ============================================================ */
:root{
  --abyss:#080D13;
  --chart:#0E1720;
  --chart-2:#14212C;
  --chart-3:#1B2C39;
  --rule:#243543;
  --rule-soft:#1A2833;
  --ink:#E6EEF3;
  --ink-2:#9FB3C0;
  --ink-3:#67808F;
  --brass:#E8A33D;
  --brass-2:#F5CE86;
  --brass-dim:#8A6425;
  --sea:#4EA9C9;
  --sea-dim:#2A5F75;
  --new:#E2544F;
  --learn:#E8A33D;
  --master:#3DD68C;
  --land:#2A3D4C;
  --land-edge:#405A6D;
  --shadow:0 18px 44px -20px rgba(0,0,0,.85);
  --f-display:'Fraunces','Iowan Old Style',Georgia,'Times New Roman',serif;
  --f-ui:'Archivo','Helvetica Neue',Helvetica,system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:286px;
  --panel:372px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--abyss);color:var(--ink);
  font-family:var(--f-ui);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:9px;border:2px solid var(--chart)}
::-webkit-scrollbar-thumb:hover{background:var(--chart-3)}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:var(--rail) 1fr var(--panel);height:100vh;height:100dvh}

/* ---------- left rail ---------- */
#rail{
  background:var(--chart);border-right:1px solid var(--rule-soft);
  display:flex;flex-direction:column;min-height:0;
}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--rule-soft);display:flex;gap:12px;align-items:center}
.brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 32% 28%,#2D4658,#101C25 70%);
  border:1px solid var(--brass-dim);box-shadow:inset 0 0 12px rgba(232,163,61,.18)}
.brand-mark::before,.brand-mark::after{content:'';position:absolute;background:var(--brass);opacity:.75}
.brand-mark::before{left:50%;top:4px;bottom:4px;width:1px;transform:translateX(-.5px)}
.brand-mark::after{top:50%;left:4px;right:4px;height:1px;transform:translateY(-.5px)}
.brand h1{font-family:var(--f-display);font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-family:var(--f-mono)}

.rail-scroll{flex:1;overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:16px;min-height:0}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>h2{
  margin:0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);font-family:var(--f-mono);font-weight:500;padding:0 6px;
}
.modes{display:flex;flex-direction:column;gap:1px}
.mode{
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;
  color:var(--ink-2);text-align:left;transition:background .14s,color .14s;position:relative;
}
.mode:hover{background:var(--chart-2);color:var(--ink)}
.mode[aria-current="true"]{background:var(--chart-3);color:var(--ink)}
.mode[aria-current="true"]::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--brass);border-radius:2px}
.mode .ic{width:18px;text-align:center;font-size:14px;color:var(--brass);opacity:.9}
.mode .lbl{font-weight:500;font-size:13.5px}
.mode .sub{display:block;font-size:11px;color:var(--ink-3);font-weight:400;line-height:1.3}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  padding:5px 10px;border-radius:999px;border:1px solid var(--rule);
  font-size:11.5px;color:var(--ink-2);background:var(--chart-2);transition:.14s;
}
.chip:hover{border-color:var(--sea-dim);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1A1206;font-weight:600}

#legend{display:flex;flex-direction:column;gap:5px;padding:10px;background:var(--chart-2);border:1px solid var(--rule-soft);border-radius:9px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2)}
.leg-sw{width:13px;height:13px;border-radius:3px;flex:0 0 13px;border:1px solid rgba(255,255,255,.12)}
#legend .leg-title{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--chart-2);border:1px solid var(--rule-soft);border-radius:9px;padding:8px 9px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:var(--f-mono)}
.stat.s-new b{color:var(--new)}.stat.s-learn b{color:var(--learn)}.stat.s-master b{color:var(--master)}

#progress-bar{height:7px;border-radius:99px;background:var(--chart-3);overflow:hidden;display:flex}
#progress-bar i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}

.rail-foot{padding:12px 14px;border-top:1px solid var(--rule-soft);display:flex;gap:6px}
.tbtn{flex:1;padding:7px;border-radius:7px;border:1px solid var(--rule);font-size:11.5px;color:var(--ink-2);background:var(--chart-2)}
.tbtn:hover{color:var(--ink);border-color:var(--sea-dim)}

/* ---------- map stage ---------- */
#stage{position:relative;background:var(--abyss);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.dragging{cursor:grabbing}
#map.picking{cursor:crosshair}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(0,0,0,.42) 100%)}

.hud{position:absolute;z-index:3}
#hud-top{top:14px;left:14px;right:14px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.glass{background:rgba(14,23,32,.86);backdrop-filter:blur(10px);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
#search-wrap{position:relative;width:250px}
#search{width:100%;padding:9px 12px 9px 32px;border-radius:10px;border:1px solid var(--rule);
  background:rgba(14,23,32,.86);backdrop-filter:blur(10px);color:var(--ink);font-size:13px}
#search::placeholder{color:var(--ink-3)}
#search-wrap .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:12px;pointer-events:none}
#suggest{position:absolute;top:calc(100% + 5px);left:0;right:0;max-height:280px;overflow-y:auto;border-radius:10px;padding:5px;display:none;z-index:5}
#suggest.on{display:block}
#suggest button{display:flex;width:100%;gap:9px;align-items:center;padding:7px 9px;border-radius:7px;text-align:left;font-size:13px}
#suggest button:hover,#suggest button.sel{background:var(--chart-3)}
#suggest .sg-flag{font-size:15px}
#suggest .sg-sub{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-family:var(--f-mono)}

#overlay-bar{display:flex;gap:4px;padding:4px;border-radius:10px}
.ov{padding:6px 11px;border-radius:7px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.ov:hover{background:var(--chart-2);color:var(--ink)}
.ov[aria-pressed="true"]{background:var(--chart-3);color:var(--brass-2);font-weight:600}

#hud-bottom{bottom:14px;left:14px;display:flex;gap:8px;align-items:flex-end}
#zoomer{display:flex;flex-direction:column;padding:4px;border-radius:10px;gap:2px}
#zoomer button{width:30px;height:30px;border-radius:7px;color:var(--ink-2);font-size:15px;display:grid;place-items:center;font-family:var(--f-mono)}
#zoomer button:hover{background:var(--chart-3);color:var(--ink)}
#scalebar{padding:7px 10px;border-radius:10px;font-family:var(--f-mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em}
#scalebar .bar{height:3px;background:var(--ink-3);margin-top:4px;border-radius:2px}

#hover-tip{position:absolute;z-index:4;pointer-events:none;padding:6px 10px;border-radius:8px;
  font-size:12.5px;display:none;align-items:center;gap:7px;white-space:nowrap;transform:translate(-50%,-150%)}
#hover-tip.on{display:flex}
#hover-tip .ht-dot{width:7px;height:7px;border-radius:50%}

#compare-hud{position:absolute;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);
  padding:10px 14px;border-radius:11px;display:none;gap:14px;align-items:center;max-width:min(560px,90%)}
#compare-hud.on{display:flex}
#compare-hud .ch-txt{font-size:12.5px;color:var(--ink-2);line-height:1.35}
#compare-hud .ch-txt b{color:var(--brass-2)}

#toast-zone{position:absolute;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:-.02em;
  animation:pop .75s cubic-bezier(.2,.9,.3,1) forwards;text-shadow:0 4px 24px rgba(0,0,0,.7)}
.toast.good{color:var(--master)}.toast.bad{color:var(--new)}
@keyframes pop{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.04)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1) translateY(-22px)}}

#combo{position:absolute;z-index:5;top:50%;right:20px;transform:translateY(-50%);text-align:right;display:none}
#combo.on{display:block}
#combo b{display:block;font-family:var(--f-display);font-size:52px;line-height:.9;color:var(--brass-2);font-weight:700;
  text-shadow:0 0 30px rgba(232,163,61,.45)}
#combo span{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- right panel ---------- */
#panel{background:var(--chart);border-left:1px solid var(--rule-soft);display:flex;flex-direction:column;min-height:0}
.panel-head{padding:15px 18px 12px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:center;gap:10px;min-height:56px}
.panel-head h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.01em}
.panel-head .eyebrow{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:2px}
.panel-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px;min-height:0}
.panel-body>*{flex:0 0 auto}

/* dossier */
.dossier-hero{display:flex;gap:13px;align-items:flex-start}
.dossier-hero .fl{font-size:44px;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.dossier-hero h3{margin:0;font-family:var(--f-display);font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
.dossier-hero .off{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.3}
.mastery-tag{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:3px 9px;border-radius:999px;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.mastery-tag i{width:6px;height:6px;border-radius:50%;display:block}
.mt-new{background:rgba(226,84,79,.14);color:#F08A86}
.mt-learn{background:rgba(232,163,61,.14);color:var(--brass-2)}
.mt-master{background:rgba(61,214,140,.14);color:var(--master)}

.mnemonic{
  position:relative;padding:14px 16px 14px 18px;border-radius:11px;
  background:linear-gradient(135deg,rgba(232,163,61,.10),rgba(232,163,61,.03));
  border:1px solid rgba(232,163,61,.22);
}
.mnemonic::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:2px;background:var(--brass);border-radius:2px}
.mnemonic .mn-label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:5px}
.mnemonic p{margin:0;font-family:var(--f-display);font-size:15px;line-height:1.45;color:var(--brass-2);font-weight:400}

.facts{display:grid;grid-template-columns:1fr;gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);border-radius:10px;overflow:hidden}
.fact{background:var(--chart-2);padding:9px 12px;display:flex;gap:12px;align-items:baseline}
.fact dt{flex:0 0 88px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.fact dd{margin:0;font-size:13px;flex:1;line-height:1.35}
.fact dd .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.sub-h{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:0 0 7px}
.nbr-list{display:flex;flex-wrap:wrap;gap:5px}
.nbr{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;background:var(--chart-2);
  border:1px solid var(--rule);font-size:12px;color:var(--ink-2);transition:.14s}
.nbr:hover{border-color:var(--sea);color:var(--ink);background:var(--chart-3)}
.desc-card{background:var(--chart-2);border:1px solid var(--rule-soft);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.desc-card b{color:var(--ink);font-weight:600}

.act-row{display:flex;gap:7px;flex-wrap:wrap}
.act{padding:8px 13px;border-radius:8px;border:1px solid var(--rule);background:var(--chart-2);font-size:12.5px;color:var(--ink-2);font-weight:500}
.act:hover{border-color:var(--brass-dim);color:var(--brass-2)}
.act.primary{background:var(--brass);border-color:var(--brass);color:#180F03;font-weight:600}
.act.primary:hover{background:var(--brass-2);color:#180F03}

/* quiz */
.qcard{display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.qmeta .spacer{flex:1}
.qmeta .score{color:var(--brass-2);font-variant-numeric:tabular-nums}
#timer-track{height:4px;border-radius:99px;background:var(--chart-3);overflow:hidden}
#timer-track i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .25s linear}
#timer-track.warn i{background:var(--new)}
.qprompt{font-family:var(--f-display);font-size:21px;line-height:1.3;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
.qprompt em{font-style:normal;color:var(--brass-2)}
.qsub{font-size:12.5px;color:var(--ink-3);margin:-6px 0 0}
.qbig{font-size:76px;line-height:1;text-align:center;padding:8px 0;filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
.qdesc{background:var(--chart-2);border:1px solid var(--rule-soft);border-left:2px solid var(--sea);border-radius:0 10px 10px 0;
  padding:13px 15px;font-family:var(--f-display);font-size:15.5px;line-height:1.5;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:9px;border:1px solid var(--rule);
  background:var(--chart-2);text-align:left;font-size:14px;transition:.13s;position:relative}
.opt:hover:not(:disabled){border-color:var(--sea-dim);background:var(--chart-3);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt .key{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);border:1px solid var(--rule);border-radius:4px;
  width:18px;height:18px;display:grid;place-items:center;flex:0 0 18px}
.opt .oflag{font-size:19px}
.opt.correct{border-color:var(--master);background:rgba(61,214,140,.12)}
.opt.correct .key{border-color:var(--master);color:var(--master)}
.opt.wrong{border-color:var(--new);background:rgba(226,84,79,.12)}
.opt.wrong .key{border-color:var(--new);color:var(--new)}
.opt.dim{opacity:.45}

.verdict{border-radius:11px;padding:13px 15px;display:flex;flex-direction:column;gap:6px;animation:slidein .25s ease}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict.good{background:rgba(61,214,140,.10);border:1px solid rgba(61,214,140,.3)}
.verdict.bad{background:rgba(226,84,79,.10);border:1px solid rgba(226,84,79,.3)}
.verdict .vh{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.verdict.good .vh{color:var(--master)}.verdict.bad .vh{color:#F08A86}
.verdict p{margin:0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.verdict p b{color:var(--ink)}

/* matching */
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.match-col{display:flex;flex-direction:column;gap:6px}
.mtile{padding:10px 11px;border-radius:9px;border:1px solid var(--rule);background:var(--chart-2);
  font-size:13px;text-align:left;transition:.13s;display:flex;align-items:center;gap:8px;min-height:44px}
.mtile:hover:not(:disabled){border-color:var(--sea-dim)}
.mtile.picked{border-color:var(--brass);background:rgba(232,163,61,.12);box-shadow:0 0 0 1px var(--brass)}
.mtile.done{opacity:.35;cursor:default;border-style:dashed}
.mtile.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mtile .mfl{font-size:21px}

/* route */
.route-chain{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rstep{padding:5px 10px;border-radius:7px;background:var(--chart-2);border:1px solid var(--rule);font-size:12px;display:flex;gap:6px;align-items:center}
.rstep.done{border-color:var(--master);color:var(--master)}
.rstep.cur{border-color:var(--brass);color:var(--brass-2)}
.route-arrow{color:var(--ink-3);font-size:11px}
.cap-input{display:flex;gap:7px}
.cap-input input{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--rule);background:var(--chart-2);font-size:14px}
.cap-input input:focus{border-color:var(--brass);outline:none}

/* trophies */
.trophy-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.trophy{background:var(--chart-2);border:1px solid var(--rule-soft);border-radius:11px;padding:13px;text-align:center;
  display:flex;flex-direction:column;gap:5px;align-items:center;position:relative;overflow:hidden}
.trophy.locked{opacity:.42}
.trophy.won{border-color:rgba(232,163,61,.4);background:linear-gradient(160deg,rgba(232,163,61,.10),var(--chart-2))}
.trophy .tico{font-size:26px;filter:grayscale(1)}
.trophy.won .tico{filter:none}
.trophy b{font-size:12.5px;font-weight:600;line-height:1.2}
.trophy small{font-size:10.5px;color:var(--ink-3);line-height:1.3}
.trophy .tprog{width:100%;height:3px;border-radius:9px;background:var(--chart-3);overflow:hidden;margin-top:2px}
.trophy .tprog i{display:block;height:100%;background:var(--brass)}

.empty{text-align:center;padding:34px 18px;color:var(--ink-3)}
.empty .eico{font-size:32px;opacity:.5;margin-bottom:9px}
.empty p{margin:0;font-size:13px;line-height:1.5}

.deck-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;background:var(--chart-2);border:1px solid var(--rule-soft);font-size:13px}
.deck-row .dfl{font-size:18px}
.deck-row .dmiss{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:#F08A86}

.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 10px;border-radius:999px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;background:var(--chart-2);border:1px solid var(--rule);color:var(--ink-3)}
.pill.on{border-color:var(--brass-dim);color:var(--brass-2)}

/* mobile */
#mtabs{display:none}
@media (max-width:1180px){
  :root{--rail:238px;--panel:330px}
}
@media (max-width:900px){
  body{overflow:auto}
  #shell{grid-template-columns:1fr;grid-template-rows:44vh auto auto;height:auto;min-height:100dvh}
  #stage{order:1;min-height:44vh}
  #panel{order:2;border-left:none;border-top:1px solid var(--rule-soft)}
  #rail{order:3;border-right:none;border-top:1px solid var(--rule-soft)}
  .brand{padding:14px 16px 12px}
  .rail-scroll{padding:12px}
  .panel-body{padding:16px}
  .modes{flex-direction:row;flex-wrap:wrap}
  .mode{flex:1 1 132px;padding:9px 10px}
  .mode .lbl{font-size:13px}
  .mode .sub{display:none}
  #search-wrap{width:min(58vw,220px)}
  #hud-top{gap:6px}
  .ov{padding:6px 9px;font-size:11.5px}
}
</style>

<div id="shell">

  <!-- ══ LEFT RAIL ══ -->
  <aside id="rail">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>Zemya</h1>
        <p>Cognitive Geography</p>
      </div>
    </div>

    <div class="rail-scroll">
      <div class="grp">
        <h2>Mode</h2>
        <nav class="modes" id="modes"></nav>
      </div>

      <div class="grp" id="ov-grp">
        <h2>Map overlay</h2>
        <div class="chips" id="ov-chips"></div>
        <div id="legend"></div>
      </div>

      <div class="grp">
        <h2>Mastery</h2>
        <div id="progress-bar" role="img" aria-label="Mastery progress"></div>
        <div class="stat-grid">
          <div class="stat s-master"><b id="st-master">0</b><span>Mastered</span></div>
          <div class="stat s-learn"><b id="st-learn">0</b><span>Learning</span></div>
          <div class="stat s-new"><b id="st-new">0</b><span>New</span></div>
          <div class="stat"><b id="st-acc">—</b><span>Accuracy</span></div>
          <div class="stat"><b id="st-streak">0</b><span>Streak</span></div>
          <div class="stat"><b id="st-miss">0</b><span>Deck</span></div>
        </div>
      </div>
    </div>

    <div class="rail-foot">
      <button class="tbtn" id="btn-export" title="Copy your progress as JSON">Export</button>
      <button class="tbtn" id="btn-import" title="Restore progress from JSON">Import</button>
      <button class="tbtn" id="btn-reset" title="Erase all progress">Reset</button>
    </div>
  </aside>

  <!-- ══ MAP STAGE ══ -->
  <main id="stage">
    <canvas id="map"></canvas>

    <div class="hud" id="hud-top">
      <div id="search-wrap">
        <span class="mag" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search countries, capitals…" autocomplete="off" spellcheck="false" aria-label="Search countries">
        <div id="suggest" class="glass" role="listbox"></div>
      </div>
      <div id="overlay-bar" class="glass"></div>
    </div>

    <div class="hud" id="hud-bottom">
      <div id="zoomer" class="glass">
        <button id="z-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="z-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="z-home" title="Reset view" aria-label="Reset view">⌂</button>
      </div>
      <div id="scalebar" class="glass"><span id="scale-label">—</span><div class="bar" id="scale-bar"></div></div>
    </div>

    <div id="hover-tip" class="glass"><i class="ht-dot"></i><span></span></div>
    <div id="compare-hud" class="glass"></div>
    <div id="toast-zone"></div>
    <div id="combo"><b>×1</b><span>Combo</span></div>
  </main>

  <!-- ══ RIGHT PANEL ══ -->
  <aside id="panel">
    <div class="panel-head">
      <div><span class="eyebrow" id="panel-eyebrow">Dossier</span><h2 id="panel-title">Select a country</h2></div>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>

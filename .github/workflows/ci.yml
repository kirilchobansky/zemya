name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Rebuild content and fail if it differs from what is committed
        run: |
          npm run build:content
          git diff --exit-code -- public/data \
            || (echo "::error::public/data is stale — run 'npm run build:content' and commit the result" && exit 1)

      - name: Build
        run: npx react-router build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: npm test

# San Marino (SMR)
#
# Authored content only. Capital, currency, languages, borders, area and the flag
# emoji all come from the ISO dataset at build time — do not duplicate them here.
#
#   religion  specific, not a coarse bucket (Eastern Orthodoxy, not Christianity)
#   flag      geometry and colour, readable aloud without seeing the flag
#   outline   the silhouette as a thing you would recognise
#   hook      one concrete, surprising sentence. never an encyclopaedia summary
#   population  optional override; omit to use the dataset value

iso3: SMR
slug: san-marino
name: San Marino
religion: Roman Catholicism
flag: White over light blue with the three-towered coat of arms.
outline: A pinprick on an Italian mountaintop.
hook: The world's oldest surviving republic — founded in the year 301.
population: 33642
override:
  capital: San Marino
  note: >
    world-countries lists the official long form "City of San Marino". The city is San Marino
    everywhere else, including GeoNames, and the country shares the name, so this makes the
    capital the same string as the country like Monaco and Singapore. "City of San Marino" is
    still accepted as a capital alias.

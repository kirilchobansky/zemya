# Nigeria (NGA)
#
# Authored content only. Capital, currency, languages, borders, area and the flag
# emoji all come from the ISO dataset at build time — do not duplicate them here.
#
#   religion  specific, not a coarse bucket (Eastern Orthodoxy, not Christianity)
#   flag      geometry and colour, readable aloud without seeing the flag
#   outline   the silhouette as a thing you would recognise
#   hook      one concrete, surprising sentence. never an encyclopaedia summary
#   population  optional override; omit to use the dataset value

iso3: NGA
slug: nigeria
name: Nigeria
religion: Christianity and Sunni Islam, roughly evenly split
flag: "Three vertical bands: green, white, green."
outline: A broad block with the Niger delta fanning into the Gulf.
hook: Africa's most populous country, split almost evenly between Muslim north and Christian south.
population: 232679478

disputed:
  religion: >
    Nigeria has not asked religion in a census since 1963 because the split is
    contested. Survey estimates put Muslims and Christians within a few points of each
    other and disagree on which is larger. There is no answer precise enough to test.

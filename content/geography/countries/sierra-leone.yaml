# Sierra Leone (SLE)
#
# Authored content only. Capital, currency, languages, borders, area and the flag
# emoji all come from the ISO dataset at build time — do not duplicate them here.
#
#   religion  specific, not a coarse bucket (Eastern Orthodoxy, not Christianity)
#   flag      geometry and colour, readable aloud without seeing the flag
#   outline   the silhouette as a thing you would recognise
#   hook      one concrete, surprising sentence. never an encyclopaedia summary
#   population  optional override; omit to use the dataset value

iso3: SLE
slug: sierra-leone
name: Sierra Leone
religion: Sunni Islam
flag: "Three horizontal bands: green, white, blue."
outline: A small rounded shape with a mountainous peninsula at Freetown.
hook: Named "lion mountains" by a Portuguese sailor who heard thunder in the hills.
population: 8642022
override:
  currencyCode: SLE
  currencyName: Sierra Leonean leone
  currencySymbol: Le
  note: >
    Sierra Leone redenominated the leone (1,000 old = 1 new) on 1 April 2022 and the old
    SLL code was replaced by SLE. world-countries 5.1 still ships SLL. Confirmed against
    the ISO 4217 list one (SLE "Leone"; no SLL entry).

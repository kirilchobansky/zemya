# Bulgaria (BGR)
#
# Authored content only. Capital, currency, languages, borders, area and the flag
# emoji all come from the ISO dataset at build time — do not duplicate them here.
#
#   religion  specific, not a coarse bucket (Eastern Orthodoxy, not Christianity)
#   flag      geometry and colour, readable aloud without seeing the flag
#   outline   the silhouette as a thing you would recognise
#   hook      one concrete, surprising sentence. never an encyclopaedia summary
#   population  optional override; omit to use the dataset value

iso3: BGR
slug: bulgaria
name: Bulgaria
religion: Eastern Orthodoxy
flag: "Three horizontal bands: white, green, red."
outline: A blunt fist punching east toward the Black Sea.
hook: Bulgaria gave the world the Cyrillic alphabet — every Russian letter traces back here.
population: 6714560
override:
  currencyCode: EUR
  currencyName: Euro
  currencySymbol: "€"
  note: >
    Bulgaria adopted the euro on 1 January 2026 and the lev is no longer legal tender.
    world-countries 5.1 still ships the Bulgarian lev (BGN); countries-list has EUR.
    Delete this block once upstream catches up (npm run audit will show them agreeing).

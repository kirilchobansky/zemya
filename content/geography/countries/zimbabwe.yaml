# Zimbabwe (ZWE)
#
# Authored content only. Capital, currency, languages, borders, area and the flag
# emoji all come from the ISO dataset at build time — do not duplicate them here.
#
#   religion  specific, not a coarse bucket (Eastern Orthodoxy, not Christianity)
#   flag      geometry and colour, readable aloud without seeing the flag
#   outline   the silhouette as a thing you would recognise
#   hook      one concrete, surprising sentence. never an encyclopaedia summary
#   population  optional override; omit to use the dataset value

iso3: ZWE
slug: zimbabwe
name: Zimbabwe
religion: Christianity
flag: Seven coloured stripes with a white triangle and the Zimbabwe Bird.
outline: A landlocked shape like a teapot, bordered by the Zambezi and Limpopo.
hook: Once printed a 100 trillion dollar note during hyperinflation.
population: 16634373
override:
  currencyCode: ZWG
  currencyName: Zimbabwe Gold
  currencySymbol: ZiG
  note: >
    world-countries 5.1 ships the Botswana pula (BWP) for Zimbabwe, which is simply wrong.
    The Reserve Bank of Zimbabwe replaced the Zimbabwe dollar with Zimbabwe Gold (ZiG) in
    April 2024. Confirmed against the ISO 4217 list one (ZWG "Zimbabwe Gold").

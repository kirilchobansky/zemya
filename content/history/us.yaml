# United States (us) — history timeline, first pass
#
# Source: content/history/source-us.txt (hand-authored reference chronology, English).
# Same schema as bg.yaml — see the schema comment at the top of that file. Lanes in use:
# periods and presidents (kind ruler, role президент). The government and event lanes are
# empty for now: no vice presidents or events yet.
#
# Presidents with two lines are one person (Cleveland: 22nd and 24th, Trump: 45th and 47th);
# the ids carry -1 / -2. Bare surnames shared by two different people (Adams, Harrison,
# Johnson, Roosevelt) are deliberately not aliases: fill-quiz.ts never accepts a spelling
# that belongs to two different people.
# elected: false marks the five presidents who never won the office in their own right
# (Tyler, Fillmore, A. Johnson, Arthur, Ford). Tier 1: Washington, Jefferson, Lincoln,
# T. Roosevelt, F. D. Roosevelt; the other presidents are tier 2.

entries:
  # ---------------------------------------------------------------- periods
  # Dates before 1752 are as commonly cited, not converted: 12.10.1492 (Columbus) is the Julian date and
  # 14.05.1607 (Jamestown) is old style. Every date is written style: new (the old-style flag is Bulgarian only).
  - id: period-early-exploration
    kind: period
    name: { bg: "Ранни изследвания", en: "Early Exploration" }
    aliases: []
    start: "1492-10-12"
    end: "1607-05-13"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Европейски мореплаватели достигат Америка, а коренните народи вече живеят на континента."
      en: "European navigators reach the Americas, where Indigenous peoples already live."

  - id: period-early-colonies
    kind: period
    name: { bg: "Ранни колонии", en: "Early Colonies" }
    aliases: []
    start: "1607-05-14"
    end: "1763-02-09"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Европейски селища възникват по източното крайбрежие на Северна Америка."
      en: "European settlements are founded along the eastern coast of North America."

  - id: period-revolutionary-era
    kind: period
    name: { bg: "Революционна епоха", en: "Revolutionary Era" }
    aliases: []
    start: "1763-02-10"
    end: "1783-09-02"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Тринадесетте колонии се противопоставят на британската власт и водят война за независимост."
      en: "The Thirteen Colonies resist British rule and fight a war of independence."

  - id: period-confederation-and-constitution
    kind: period
    name: { bg: "Конфедерация и Конституция", en: "Confederation and Constitution" }
    aliases: []
    start: "1783-09-03"
    end: "1789-04-29"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Новата държава се управлява по Устава на Конфедерацията, а после приема Конституцията."
      en: "The new country is governed under the Articles of Confederation and then adopts the Constitution."

  - id: period-early-republic
    kind: period
    name: { bg: "Ранна република", en: "Early Republic" }
    aliases: []
    start: "1789-04-30"
    end: "1829-03-03"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Първите президенти изграждат институциите на федералната власт."
      en: "The first presidents build the institutions of the federal government."

  - id: period-jacksonian-era-and-expansion
    kind: period
    name: { bg: "Джаксъновата епоха и експанзия", en: "Jacksonian Era and Expansion" }
    aliases: []
    start: "1829-03-04"
    end: "1861-04-11"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Правото на глас се разширява сред белите мъже, а страната се разраства на запад."
      en: "Voting rights widen among white men and the country expands westward."

  - id: period-civil-war
    kind: period
    name: { bg: "Гражданска война", en: "Civil War" }
    aliases: []
    start: "1861-04-12"
    end: "1865-04-09"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Северните и южните щати воюват помежду си заради сецесията и робството."
      en: "The Northern and Southern states fight each other over secession and slavery."

  - id: period-reconstruction
    kind: period
    name: { bg: "Реконструкция", en: "Reconstruction" }
    aliases: []
    start: "1865-04-10"
    end: "1877-03-04"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Южните щати се връщат в Съюза, а робството е формално отменено."
      en: "The Southern states are readmitted to the Union and slavery is formally abolished."

  - id: period-gilded-age-and-progressive-era
    kind: period
    name: { bg: "Позлатена епоха и прогресивна ера", en: "Gilded Age and Progressive Era" }
    aliases: []
    start: "1877-03-05"
    end: "1917-04-05"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Бърза индустриализация и имиграция, последвани от реформи."
      en: "Rapid industrialisation and immigration, followed by reform movements."

  - id: period-world-wars-and-interwar-years
    kind: period
    name: { bg: "Световни войни и междувоенни години", en: "World Wars and Interwar Years" }
    aliases: []
    start: "1917-04-06"
    end: "1945-09-02"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Страната участва в две световни войни и преживява Голямата депресия."
      en: "The country takes part in two world wars and lives through the Great Depression."

  - id: period-cold-war
    kind: period
    name: { bg: "Студена война", en: "Cold War" }
    aliases: []
    start: "1945-09-03"
    end: "1991-12-26"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Съединените щати се съревновават със Съветския съюз в политиката, армията и науката."
      en: "The United States competes with the Soviet Union in politics, arms and science."

  - id: period-post-cold-war-era
    kind: period
    name: { bg: "Следстудениковоенна епоха", en: "Post-Cold War Era" }
    aliases: []
    start: "1991-12-27"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Съединените щати остават водеща военна и икономическа сила след разпадането на СССР."
      en: "The United States remains a leading military and economic power after the Soviet collapse."

  # ---------------------------------------------------------------- presidents
  - id: pres-washington
    kind: ruler
    name: { bg: "Джордж Вашингтон", en: "George Washington" }
    aliases: ["Washington", "G. Washington", "Вашингтон"]
    role: президент
    start: "1789-04-30"
    end: "1797-03-03"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Командвал Континенталната армия и въвел много прецеденти, сред които оттеглянето след два мандата."
      en: "Commanded the Continental Army and set many precedents, including stepping down after two terms."

  - id: pres-j-adams
    kind: ruler
    name: { bg: "Джон Адамс", en: "John Adams" }
    aliases: ["John Adams Sr"]
    role: президент
    start: "1797-03-04"
    end: "1801-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Първият президент, живял в Белия дом; мандатът му е белязан от Квазивойната с Франция и законите за чужденците и размирниците."
      en: "First president to live in the White House; his term was shaped by the Quasi-War with France and the Alien and Sedition Acts."

  - id: pres-jefferson
    kind: ruler
    name: { bg: "Томас Джеферсън", en: "Thomas Jefferson" }
    aliases: ["Jefferson", "T. Jefferson", "Джеферсън"]
    role: президент
    start: "1801-03-04"
    end: "1809-03-03"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Автор на Декларацията за независимост, удвоил територията на страната с покупката на Луизиана (1803)."
      en: "Author of the Declaration of Independence who doubled the country's size with the Louisiana Purchase (1803)."

  - id: pres-madison
    kind: ruler
    name: { bg: "Джеймс Мадисън", en: "James Madison" }
    aliases: ["Madison", "J. Madison", "Мадисън"]
    role: президент
    start: "1809-03-04"
    end: "1817-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Главен архитект на Конституцията и автор на Закона за правата; води страната във Войната от 1812 г."
      en: "Main architect of the Constitution and author of the Bill of Rights; led the country in the War of 1812."

  - id: pres-monroe
    kind: ruler
    name: { bg: "Джеймс Монро", en: "James Monroe" }
    aliases: ["Monroe", "J. Monroe", "Монро"]
    role: президент
    start: "1817-03-04"
    end: "1825-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Начело в „Ерата на добрите чувства“; обявява доктрината Монро (1823) срещу нови европейски колонии в Америка."
      en: "Presided over the \"Era of Good Feelings\" and announced the Monroe Doctrine (1823) against new European colonies in the Americas."

  - id: pres-jq-adams
    kind: ruler
    name: { bg: "Джон Куинси Адамс", en: "John Quincy Adams" }
    aliases: ["J. Q. Adams", "JQA", "Adams Jr"]
    role: президент
    start: "1825-03-04"
    end: "1829-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Избран от Камарата на представителите, след като изборите през 1824 г. нямат победител с мнозинство; син на Джон Адамс."
      en: "Chosen by the House of Representatives after the 1824 election had no majority winner; son of John Adams."

  - id: pres-jackson
    kind: ruler
    name: { bg: "Андрю Джаксън", en: "Andrew Jackson" }
    aliases: ["Jackson", "A. Jackson", "Джаксън"]
    role: президент
    start: "1829-03-04"
    end: "1837-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Разширява президентската власт, воюва срещу Втората банка на САЩ и подписва Закона за преселването на индианците (1830)."
      en: "Expanded presidential power, fought the Second Bank of the United States and signed the Indian Removal Act (1830)."

  - id: pres-van-buren
    kind: ruler
    name: { bg: "Мартин Ван Бюрен", en: "Martin Van Buren" }
    aliases: ["Van Buren", "M. Van Buren", "Ван Бюрен"]
    role: президент
    start: "1837-03-04"
    end: "1841-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Начело по време на паниката от 1837 г. и дългата депресия след нея; първият президент, роден като гражданин на САЩ."
      en: "Presided over the Panic of 1837 and the long depression that followed; first president born a US citizen."

  - id: pres-wh-harrison
    kind: ruler
    name: { bg: "Уилям Хенри Харисън", en: "William Henry Harrison" }
    aliases: ["W. H. Harrison", "Old Tippecanoe", "Староселски Типекану"]
    role: президент
    start: "1841-03-04"
    end: "1841-04-04"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Умира 31 дни след встъпването в длъжност – най-краткото президентство в историята на САЩ."
      en: "Died 31 days after taking office, the shortest presidency in US history."

  - id: pres-tyler
    kind: ruler
    name: { bg: "Джон Тайлър", en: "John Tyler" }
    aliases: ["Tyler", "J. Tyler", "Тайлър"]
    role: президент
    elected: false
    start: "1841-04-04"
    end: "1845-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Първият вицепрезидент, поел поста след смъртта на президент, с което създава прецедента да става пълноправен президент; присъединяването на Тексас е одобрено в края на мандата му."
      en: "First vice president to take over after a president's death, setting the precedent that he becomes full president; Texas annexation was approved at the end of his term."

  - id: pres-polk
    kind: ruler
    name: { bg: "Джеймс К. Полк", en: "James K. Polk" }
    aliases: ["Polk", "J. K. Polk", "James Polk", "Полк"]
    role: президент
    start: "1845-03-04"
    end: "1849-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Печели Мексиканско-американската война (1846–48) и придобива Калифорния и Югозапада; урежда границата в Орегон с Великобритания."
      en: "Won the Mexican-American War (1846-48), gaining California and the Southwest, and settled the Oregon border with Britain."

  - id: pres-taylor
    kind: ruler
    name: { bg: "Закъри Тейлър", en: "Zachary Taylor" }
    aliases: ["Taylor", "Z. Taylor", "Old Rough and Ready", "Тейлър"]
    role: президент
    start: "1849-03-04"
    end: "1850-07-09"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Генерал и герой от Мексиканско-американската война, починал на поста по време на кризата за робството в новите територии. Положил клетва на 05.03.1849 г., защото 04.03 е бил неделя."
      en: "General and hero of the Mexican-American War who died in office during the crisis over slavery in the new territories. His oath was taken on 05.03.1849 because 04.03 was a Sunday."

  - id: pres-fillmore
    kind: ruler
    name: { bg: "Милард Филмор", en: "Millard Fillmore" }
    aliases: ["Fillmore", "M. Fillmore", "Филмор"]
    role: президент
    elected: false
    start: "1850-07-09"
    end: "1853-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Подписва Компромиса от 1850 г., включително Закона за беглите роби."
      en: "Signed the Compromise of 1850, including the Fugitive Slave Act."

  - id: pres-pierce
    kind: ruler
    name: { bg: "Франклин Пиърс", en: "Franklin Pierce" }
    aliases: ["Pierce", "F. Pierce", "Пиърс"]
    role: президент
    start: "1853-03-04"
    end: "1857-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Подписва Закона Канзас–Небраска (1854), който подновява спора за робството в териториите."
      en: "Signed the Kansas-Nebraska Act (1854), which reopened the fight over slavery in the territories."

  - id: pres-buchanan
    kind: ruler
    name: { bg: "Джеймс Бюканън", en: "James Buchanan" }
    aliases: ["Buchanan", "J. Buchanan", "Бюканън"]
    role: президент
    start: "1857-03-04"
    end: "1861-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Не успява да спре отцепването на южните щати в месеците след избора на Линкълн."
      en: "Failed to stop the secession of Southern states in the months after Lincoln's election."

  - id: pres-lincoln
    kind: ruler
    name: { bg: "Ейбрахам Линкълн", en: "Abraham Lincoln" }
    aliases: ["Lincoln", "A. Lincoln", "Abe Lincoln", "Линкълн"]
    role: президент
    start: "1861-03-04"
    end: "1865-04-15"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: "Води Съюза през Гражданската война, издава Прокламацията за еманципацията и е застрелян от Джон Уилкс Бут на 14.04.1865 г."
      en: "Led the Union through the Civil War, issued the Emancipation Proclamation, and was shot by John Wilkes Booth on 14.04.1865."

  - id: pres-a-johnson
    kind: ruler
    name: { bg: "Андрю Джонсън", en: "Andrew Johnson" }
    aliases: ["A. Johnson", "Andy Johnson"]
    role: президент
    elected: false
    start: "1865-04-15"
    end: "1869-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Влиза в спор с Конгреса за Реконструкцията и е първият импийчнат президент (1868), но е оправдан с един глас."
      en: "Clashed with Congress over Reconstruction and became the first president impeached (1868), but was acquitted by one vote."

  - id: pres-grant
    kind: ruler
    name: { bg: "Юлисис С. Грант", en: "Ulysses S. Grant" }
    aliases: ["Grant", "U. S. Grant", "Грант"]
    role: президент
    start: "1869-03-04"
    end: "1877-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Генерал на Съюза, спечелил Гражданската война; като президент защитава Реконструкцията срещу Ку-клукс-клан, но управлението му е засегнато от корупционни скандали."
      en: "Union general who won the Civil War; as president he enforced Reconstruction against the Ku Klux Klan, but his administration was hit by corruption scandals."

  - id: pres-hayes
    kind: ruler
    name: { bg: "Ръдърфорд Б. Хейс", en: "Rutherford B. Hayes" }
    aliases: ["Hayes", "R. B. Hayes", "Хейс"]
    role: президент
    start: "1877-03-04"
    end: "1881-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Печели спорните избори от 1876 г. с един електорален глас; Компромисът от 1877 г. слага край на Реконструкцията. Публичната му клетва е на 05.03.1877 г., защото 04.03 е бил неделя."
      en: "Won the disputed 1876 election by one electoral vote; the Compromise of 1877 ended Reconstruction. His public oath was on 05.03.1877 because 04.03 was a Sunday."

  - id: pres-garfield
    kind: ruler
    name: { bg: "Джеймс А. Гарфийлд", en: "James A. Garfield" }
    aliases: ["Garfield", "J. A. Garfield", "Гарфийлд"]
    role: президент
    start: "1881-03-04"
    end: "1881-09-19"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Прострелян от Чарлс Гито на 02.07.1881 г. и починал 11 седмици по-късно."
      en: "Shot by Charles Guiteau on 02.07.1881 and died 11 weeks later."

  - id: pres-arthur
    kind: ruler
    name: { bg: "Честър А. Артър", en: "Chester A. Arthur" }
    aliases: ["Arthur", "C. A. Arthur", "Артър"]
    role: президент
    elected: false
    start: "1881-09-19"
    end: "1885-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Подписва Закона Пендълтън за реформа на държавната служба (1883), с който започва краят на системата на партийните облаги."
      en: "Signed the Pendleton Civil Service Reform Act (1883), which began to end the spoils system."

  - id: pres-cleveland-1
    kind: ruler
    name: { bg: "Гроувър Кливланд", en: "Grover Cleveland" }
    aliases: ["Cleveland", "G. Cleveland", "Кливланд"]
    role: президент
    start: "1885-03-04"
    end: "1889-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Първият демократ, избран след Гражданската война; известен с честността си и множеството си вета. Управлява два непоследователни мандата (22-ри и 24-ти президент)."
      en: "First Democrat elected after the Civil War; known for honesty in office and many vetoes. Served two non-consecutive terms (22nd and 24th president)."

  - id: pres-b-harrison
    kind: ruler
    name: { bg: "Бенджамин Харисън", en: "Benjamin Harrison" }
    aliases: ["B. Harrison", "Ben Harrison"]
    role: президент
    start: "1889-03-04"
    end: "1893-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Внук на Уилям Хенри Харисън; подписва Антитръстовия закон на Шърман (1890)."
      en: "Grandson of William Henry Harrison; signed the Sherman Antitrust Act (1890)."

  - id: pres-cleveland-2
    kind: ruler
    name: { bg: "Гроувър Кливланд", en: "Grover Cleveland" }
    aliases: ["Cleveland", "G. Cleveland", "Кливланд"]
    role: президент
    start: "1893-03-04"
    end: "1897-03-03"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Връща се на поста, след като губи изборите през 1888 г.; изправя се пред паниката от 1893 г. и стачката в Пулман."
      en: "Returned after losing the 1888 election; faced the Panic of 1893 and the Pullman Strike."

  - id: pres-mckinley
    kind: ruler
    name: { bg: "Уилям Маккинли", en: "William McKinley" }
    aliases: ["McKinley", "W. McKinley", "Маккинли"]
    role: президент
    start: "1897-03-04"
    end: "1901-09-14"
    precision: exact
    style: new
    tier: 2
    blurb:
      bg: "Води страната в Испано-американската война (1898), с която придобива Пуерто Рико, Гуам и Филипините; прострелян в Бъфало на 06.09.1901 г."
      en: "Led the country in the Spanish-American War (1898), gaining Puerto Rico, Guam and the Philippines; shot in Buffalo on 06.09.1901."

  - id: pres-t-roosevelt
    kind: ruler
    name: { bg: "Теодор Рузвелт", en: "Theodore Roosevelt" }

# United States (us) — history timeline, first pass
#
# Source: content/history/source-us.txt (hand-authored reference chronology, English).
# Display language: English (countries.ts `lang: 'en'`). name.bg / blurb.bg are empty; the Cyrillic
# spelling of each president is an alias, used only for typing in the quiz.
# Same schema as bg.yaml — see the schema comment at the top of that file. Lanes in use:
# periods, presidents (kind ruler, role "president"), vice presidents (kind government, role
# "Vice President", tier 2, ids vp-<surname>, -richard/-andrew/-lyndon for the three Johnsons;
# elected: false for Ford and Rockefeller, appointed under the 25th Amendment) and events
# (source-us-2.txt: tier = the source importance, colour = bg.yaml's category colour, parent =
# the period containing the date; a bare year or mm.yyyy date is the 1st of the period with
# precision year).
#
# Presidents with two lines are one person (Cleveland: 22nd and 24th, Trump: 45th and 47th);
# the ids carry -1 / -2. Bare surnames shared by two different people (Adams, Harrison,
# Johnson, Roosevelt) are deliberately not aliases: fill-quiz.ts never accepts a spelling
# that belongs to two different people.
# elected: false marks the five presidents who never won the office in their own right
# (Tyler, Fillmore, A. Johnson, Arthur, Ford). Tier 1: Washington, Jefferson, Lincoln,
# T. Roosevelt, F. D. Roosevelt; the other presidents are tier 2.

entries:
  # ---------------------------------------------------------------- periods
  # Dates before 1752 are as commonly cited, not converted: 12.10.1492 (Columbus) is the Julian date and
  # 14.05.1607 (Jamestown) is old style. Every date is written style: new (the old-style flag is Bulgarian only).
  - id: period-early-exploration
    kind: period
    name: { bg: "", en: "Early Exploration" }
    aliases: []
    start: "1492-10-12"
    end: "1607-05-13"
    precision: exact
    style: new
    tier: 1
    blurb:
      bg: ""
      en: "European navigators reach the Americas, where Indigenous peoples already live."


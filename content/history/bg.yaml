# Bulgaria (bg) — history timeline, first pass
#
# Source: content/history/source-bg.html (hand-authored reference chronology).
# Data only — no UI reads this yet (CLAUDE.md's history exception is UI scaffolding for
# the subject picker, not content; this file is the first content, added by explicit
# owner instruction — see CLAUDE.md's "Do not" section for the full note).
#
# Schema per entry (validated and parsed by scripts/lib/history.mjs):
#   id         stable slug, never reused once shipped
#   kind       period | ruler | government | event
#   name       { bg: "...", en: "..." } — both keys always present, en may be empty
#   aliases    alternate spellings (Cyrillic and Latin), for future quiz matching
#   role       Bulgarian title text: хан, цар, княз, президент, министър-председател...
#   start/end  signed year ("681", "-450") or full date ("811-07-26"); end omitted if ongoing
#   precision  exact | year | circa | disputed
#   style      old | new — old for any date before 1 April 1916 (Julian calendar)
#   tier       1..5, 1 visible at the widest zoom
#   parent     optional id, only for date-containment ambiguity (co-rulers) — unused so far
#   blurb      { bg: "...", en: "..." }, one or two sentences
#
# Tiers below (2-5) are a first-pass editorial judgement call — which rulers/officials
# read as "major" vs "minor" — not sourced from anything; revisit with the owner once the
# timeline UI exists and tiers can be checked by actually zooming through them.
#
# TODO (later pass, not this one): Second Empire rulers (source-bg.html table 4.3, ~20
# rulers 1185-1396), monarchs 1878-1946 (table 8.5: Batenberg, Ferdinand I, Boris III,
# Simeon II), communist-era leaders 1946-1989 (table 9.3: Dimitrov, Chervenkov, Zhivkov
# and the parallel BKP-secretary / premier / head-of-state tracks).

entries:
  # ---------------------------------------------------------------- periods (section 0)
  - id: period-first-empire
    kind: period
    name: { bg: "Първо българско царство", en: "First Bulgarian Empire" }
    aliases: ["First Bulgarian Kingdom", "Първо българско ханство"]
    start: "681"
    end: "1018"
    precision: year
    style: old
    tier: 1
    blurb:
      bg: "Езическо ханство, което приема християнството и става царство; завладяно от Византия след 40-годишна война."
      en: "A pagan khanate that converted to Christianity and became a tsardom; conquered by Byzantium after a 40-year war."

  - id: period-byzantine-rule
    kind: period
    name: { bg: "Византийско владичество", en: "Byzantine rule" }
    aliases: ["Byzantine Bulgaria"]
    start: "1018"
    end: "1185"
    precision: year
    style: old
    tier: 1
    blurb:
      bg: "167 години без българска държава — България е провинция на империята, докато въстанието на Асен и Петър не я възстановява."
      en: "167 years with no Bulgarian state, as a province of the Byzantine Empire, until the uprising of Asen and Peter restored it."

  - id: period-second-empire
    kind: period
    name: { bg: "Второ българско царство", en: "Second Bulgarian Empire" }
    aliases: ["Second Bulgarian Kingdom"]
    start: "1185"
    end: "1396"
    precision: year
    style: old
    tier: 1
    blurb:
      bg: "Столица Търново; връх при Иван Асен II (1230); завладяно от османците — Търново 1393, Видин 1396."
      en: "Capital Tarnovo; peaked under Ivan Asen II (1230); conquered by the Ottomans — Tarnovo in 1393, Vidin in 1396."

  - id: period-ottoman-rule
    kind: period
    name: { bg: "Османско владичество", en: "Ottoman rule" }
    aliases: ["Ottoman Bulgaria", "Turkish yoke", "турско робство"]
    start: "1396"
    end: "1878"
    precision: year
    style: old
    tier: 1
    blurb:
      bg: "Няма българска държава и, след 1767, българска църква. Завършва с Руско-турската освободителна война."
      en: "No Bulgarian state and, after 1767, no Bulgarian church. Ends with the Russo-Turkish war of liberation."

  - id: period-vazrazhdane
    kind: period
    name: { bg: "Възраждане", en: "Bulgarian National Revival" }
    aliases: ["National Revival", "Bulgarian Revival"]
    start: "1762"
    end: "1878"
    precision: year
    style: old
    tier: 1
    blurb:
      bg: "Overlaps the end of Ottoman rule on purpose: три успоредни линии — просветна, църковна, революционна — от Паисий до Освобождението."
      en: "Deliberately overlaps the end of Ottoman rule: three parallel strands — schools, church, armed revolution — from Paisius to Liberation."

  - id: period-principality-kingdom
    kind: period
    name: { bg: "Княжество и царство България", en: "Principality and Kingdom of Bulgaria" }
    aliases: ["Third Bulgarian State", "Trето българско царство"]
    start: "1878"
    end: "1946"
    precision: year
    style: old
    tier: 1
    blurb:
      bg: "Започва със Санстефанския и Берлинския договор; четири войни за независимост и обединение; свършва с референдум за република."
      en: "Begins with the Treaties of San Stefano and Berlin; four wars over independence and unification; ends with a referendum for a republic."

  - id: period-peoples-republic
    kind: period
    name: { bg: "Народна република България", en: "People's Republic of Bulgaria" }
    aliases: ["НРБ", "PRB"]
    start: "1944"
    end: "1989"
    precision: circa
    style: new
    tier: 1
    blurb:
      bg: "Еднопартийна социалистическа държава в съветската сфера; започва с преврата на 9 септември 1944, свършва със свалянето на Тодор Живков."
      en: "A one-party socialist state in the Soviet sphere; begins with the 9 September 1944 coup, ends with Todor Zhivkov's fall."

  - id: period-republic
    kind: period
    name: { bg: "Република България", en: "Republic of Bulgaria" }
    aliases: ["Third Bulgarian Republic"]
    start: "1989"
    precision: year
    style: new
    tier: 1
    blurb:
      bg: "Парламентарна република; преход към демокрация и пазарна икономика; НАТО (2004), ЕС (2007), еврозона (2026)."
      en: "A parliamentary republic; transition to democracy and a market economy; NATO (2004), EU (2007), eurozone (2026)."

